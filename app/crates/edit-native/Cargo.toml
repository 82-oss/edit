[package]
name = "edit-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Edit's native addon: edit-engine and edit-core for the Bun server (napi-rs)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
edit-core.workspace = true
edit-engine.workspace = true
edit-render = { workspace = true, features = ["bundled-fonts"] }
serde.workspace = true
# float_roundtrip: the TS server hands projects to the addon as JSON on every
# call, and serde's default float parsing isn't exact past 15 digits
# ("9.299999999999999" read as 9.3). Where serde's own reading of the text is
# what's wanted (project files, request bodies), the TS reads it as serde
# would first (apps/server/src/rust.ts `serdeParse`, `asSerdeRead`).
serde_json = { workspace = true, features = ["float_roundtrip"] }
napi ={ version = "3", default-features = false, features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "sync"] }
parking_lot = "0.12"
libc = "0.2"

# Linux: Rust's memory through mimalloc, not glibc's malloc (src/lib.rs `ALLOCATOR`).
[target.'cfg(target_os = "linux")'.dependencies]
# local_dynamic_tls: the addon is a library the server loads at run time.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
